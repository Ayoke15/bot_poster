# Optional HTTP reverse proxy behind an external TLS terminator.
# Telegram must reach the public HTTPS APP_BASE_URL, with headers forwarded intact.
server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    location /telegram/webhook/ {
        # The secret path must not be recorded in access logs.
        access_log off;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }
}
