name: Go
run-name: Go / ${{ github.event_name }} / ${{ github.head_ref || github.ref_name }}
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: poster_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poster_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - name: Explain live test eligibility
        env:
          LIVE_ENABLED: ${{ vars.RUN_LIVE_INTEGRATION == 'true' }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          IS_TRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$LIVE_ENABLED" != true ]; then
            reason='Skipped: set repository Variable RUN_LIVE_INTEGRATION=true in Settings > Secrets and variables > Actions > Variables. A Secret or Environment variable with that name does not enable this job.'
          elif [ "$IS_DEPENDABOT" = true ]; then
            reason='Skipped: Dependabot runs do not receive live test credentials.'
          elif [ "$IS_MANUAL" != true ] && [ "$IS_TRUSTED_PR" != true ]; then
            reason='Skipped: live tests run on same-repository pull_request events or workflow_dispatch. A push run intentionally skips this job; open the pull_request run.'
          else
            reason='Enabled: Live Telegram to VK will run after the test job passes. If test fails, fix it first; the live job depends on its success.'
          fi
          echo "$reason"
          echo "### Live Telegram to VK" >> "$GITHUB_STEP_SUMMARY"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - name: Run unit and PostgreSQL integration tests
        shell: bash
        run: go test -race -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/unit-test.log"
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/poster_test
      - run: go build ./cmd/bot
      - name: Annotate unit test failure
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY_UNIT'
          import os, pathlib, re
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'unit-test.log'
          if log.exists():
              for line in log.read_text(errors='replace').splitlines():
                  match = re.match(r'\s*([A-Za-z0-9_]+_test\.go):(\d+):\s*(.*)', line)
                  if match:
                      message = match[3].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error file=internal/poster/{match[1]},line={match[2]},title=Unit test failure::{message}')
                  if 'WARNING: DATA RACE' in line:
                      print('::error title=Race detector::Data race detected in test run; inspect the adjacent test failure annotation.')
          PY_UNIT

  live-integration:
    name: Live Telegram to VK
    needs: test
    if: >-
      vars.RUN_LIVE_INTEGRATION == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: live-telegram-vk-test-bot
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: poster_live_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poster_live_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Create text and photo posts in Telegram and VK
        shell: bash
        run: |
          go test -race -tags=live -run '^TestLiveTelegram(ToVK|PhotoToVK)$' -count=1 -timeout=7m -v ./internal/poster 2>&1 | tee "$RUNNER_TEMP/live-test.log"
        env:
          RUN_LIVE_INTEGRATION: 'true'
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/poster_live_test
          TG_TEST_BOT_TOKEN: ${{ secrets.TG_TEST_BOT_TOKEN }}
          VK_TEST_USER_TOKEN: ${{ secrets.VK_TEST_USER_TOKEN || secrets.VK_TEST_COMMUNITY_TOKEN }}
          TG_TEST_CHANNEL_ID: ${{ vars.TG_TEST_CHANNEL_ID }}
          TG_TEST_OWNER_ID: ${{ secrets.TG_TEST_OWNER_ID }}
          VK_TEST_GROUP_ID: ${{ vars.VK_TEST_GROUP_ID }}
      - name: Control VK upload with requests
        if: failure()
        shell: bash
        env:
          TG_TEST_BOT_TOKEN: ${{ secrets.TG_TEST_BOT_TOKEN }}
          VK_TEST_COMMUNITY_TOKEN: ${{ secrets.VK_TEST_COMMUNITY_TOKEN }}
          VK_TEST_GROUP_ID: ${{ vars.VK_TEST_GROUP_ID }}
        run: |
          test -f "$RUNNER_TEMP/photo-source.json" || exit 0
          python3 -m pip install --quiet --disable-pip-version-check requests==2.32.5
          python3 - <<'PY_CONTROL'
          import json, os, pathlib, urllib.parse
          import requests
          def stop(stage):
              print('::error title=VK SDK control::' + stage)
              raise SystemExit(1)
          def trusted(endpoint):
              p = urllib.parse.urlparse(endpoint)
              return p.scheme == 'https' and not p.username and any(p.hostname == h or (p.hostname or '').endswith('.' + h) for h in ('vk.com', 'vk.ru', 'vkuserphoto.ru', 'vkuserphoto.com', 'userapi.com'))
          try:
              session = requests.Session()
              token = os.environ['VK_TEST_COMMUNITY_TOKEN']
              bot = os.environ['TG_TEST_BOT_TOKEN']
              group = int(os.environ['VK_TEST_GROUP_ID'])
              def vk(method, **params):
                  r = session.post('https://api.vk.com/method/' + method, data=dict(access_token=token, v='5.199', **params), timeout=20)
                  if r.status_code != 200: stop(method + ': HTTP ' + str(r.status_code))
                  payload = r.json()
                  if 'error' in payload: stop(method + ': API code ' + str(payload['error'].get('error_code', 0)))
                  return payload['response']
              own = vk('groups.getById')
              own = own.get('groups', []) if isinstance(own, dict) else own
              if len(own) != 1 or own[0]['id'] != group: stop('community identity mismatch')
              source = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'photo-source.json').read_text())
              r = session.post('https://api.telegram.org/bot' + bot + '/getFile', json=source, timeout=20)
              payload = r.json()
              if not payload.get('ok'): stop('Telegram getFile failed')
              path = payload['result']['file_path']
              if '..' in path or path.startswith('/') or '?' in path: stop('invalid Telegram file path')
              r = session.get('https://api.telegram.org/file/bot' + bot + '/' + path, timeout=20)
              if r.status_code != 200 or not r.content or len(r.content) > 20*1024*1024: stop('Telegram photo download failed')
              image = r.content
              endpoint = vk('photos.getMessagesUploadServer')['upload_url']
              if not trusted(endpoint): stop('untrusted upload endpoint')
              r = session.post(endpoint, files={'photo': ('photo.jpeg', image)}, timeout=30, allow_redirects=False)
              if r.status_code != 200: stop('requests multipart HTTP ' + str(r.status_code) + '; photo bytes=' + str(len(image)))
              uploaded = r.json()
              if not uploaded.get('photo') or uploaded['photo'] == '[]': stop('requests upload returned no accepted photo; photo bytes=' + str(len(image)))
              print('::notice title=VK SDK control::requests accepted the real Telegram photo; no wall post created by control')
          except SystemExit:
              raise
          except Exception as e:
              stop('control request failed: ' + type(e).__name__)
          PY_CONTROL
      - name: Annotate live test failure
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY_ANNOTATE'
          import os, pathlib, re
          for filename in ('live-test.log',):
              log = pathlib.Path(os.environ['RUNNER_TEMP']) / filename
              if not log.exists():
                  continue
              for line in log.read_text(errors='replace').splitlines():
                  match = re.match(r'\s*([A-Za-z0-9_]+_test\.go):(\d+):\s*(.*)', line)
                  if match:
                      message = match[3].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error file=internal/poster/{match[1]},line={match[2]},title=Live integration failure::{message}')
          PY_ANNOTATE
