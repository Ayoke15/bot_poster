name: Go
run-name: Go / ${{ github.event_name }} / ${{ github.head_ref || github.ref_name }}
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: poster_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poster_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - name: Explain live test eligibility
        env:
          LIVE_ENABLED: ${{ vars.RUN_LIVE_INTEGRATION == 'true' }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          IS_TRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$LIVE_ENABLED" != true ]; then
            reason='Skipped: set repository Variable RUN_LIVE_INTEGRATION=true in Settings > Secrets and variables > Actions > Variables. A Secret or Environment variable with that name does not enable this job.'
          elif [ "$IS_DEPENDABOT" = true ]; then
            reason='Skipped: Dependabot runs do not receive live test credentials.'
          elif [ "$IS_MANUAL" != true ] && [ "$IS_TRUSTED_PR" != true ]; then
            reason='Skipped: live tests run on same-repository pull_request events or workflow_dispatch. A push run intentionally skips this job; open the pull_request run.'
          else
            reason='Enabled: Live Telegram to VK will run after the test job passes. If test fails, fix it first; the live job depends on its success.'
          fi
          echo "$reason"
          echo "### Live Telegram to VK" >> "$GITHUB_STEP_SUMMARY"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - name: Run unit and PostgreSQL integration tests
        shell: bash
        run: go test -race -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/unit-test.log"
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/poster_test
      - run: go build ./cmd/bot
      - name: Annotate unit test failure
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY_UNIT'
          import os, pathlib, re
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'unit-test.log'
          if log.exists():
              for line in log.read_text(errors='replace').splitlines():
                  match = re.match(r'\s*([A-Za-z0-9_]+_test\.go):(\d+):\s*(.*)', line)
                  if match:
                      message = match[3].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error file=internal/poster/{match[1]},line={match[2]},title=Unit test failure::{message}')
                  if 'WARNING: DATA RACE' in line:
                      print('::error title=Race detector::Data race detected in test run; inspect the adjacent test failure annotation.')
          PY_UNIT

  live-integration:
    name: Live Telegram to VK
    needs: test
    if: >-
      vars.RUN_LIVE_INTEGRATION == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: live-telegram-vk-test-bot
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: poster_live_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poster_live_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Publish VK photo with curl control
        shell: bash
        env:
          VK_TEST_COMMUNITY_TOKEN: ${{ secrets.VK_TEST_COMMUNITY_TOKEN }}
          VK_TEST_GROUP_ID: ${{ vars.VK_TEST_GROUP_ID }}
        run: |
          python3 - <<'PY_CURL'
          import hashlib, json, os, pathlib, struct, subprocess, urllib.parse, zlib
          def stop(message):
              print('::error title=Curl VK photo smoke::' + message)
              raise SystemExit(1)
          def quote(value):
              return '"' + str(value).replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n').replace('\r', '\\r') + '"'
          def request(endpoint, fields=None, photo=None):
              config = ['url = ' + quote(endpoint), 'request = "POST"']
              for key, value in (fields or {}).items():
                  config.append('data-urlencode = ' + quote(key + '=' + str(value)))
              if photo:
                  config.append('form = ' + quote('photo=@' + str(photo) + ';type=image/png;filename=photo.png'))
              result = subprocess.run(['curl', '--silent', '--show-error', '--max-time', '30', '--config', '-', '--write-out', '\n%{http_code}'], input=('\n'.join(config) + '\n').encode(), capture_output=True)
              if result.returncode: stop('curl transport exit code ' + str(result.returncode))
              body, _, status = result.stdout.rpartition(b'\n')
              if status != b'200': stop('curl HTTP ' + status.decode(errors='replace'))
              return json.loads(body)
          try:
              token = os.environ['VK_TEST_COMMUNITY_TOKEN']
              group = int(os.environ['VK_TEST_GROUP_ID'])
              def vk(method, **fields):
                  payload = request('https://api.vk.com/method/' + method, dict(access_token=token, v='5.199', **fields))
                  if 'error' in payload: stop(method + ': VK API code ' + str(payload['error'].get('error_code', 0)))
                  return payload['response']
              own = vk('groups.getById')
              own = own.get('groups', []) if isinstance(own, dict) else own
              if group <= 0 or len(own) != 1 or own[0]['id'] != group: stop('community identity mismatch')
              def chunk(kind, data):
                  return struct.pack('!I', len(data)) + kind + data + struct.pack('!I', zlib.crc32(kind + data) & 0xffffffff)
              rows = b''.join(b'\0' + bytes(c for x in range(640) for c in (x*255//639, y*255//479, (x*31+y*17)%256)) for y in range(480))
              image = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('!IIBBBBB', 640, 480, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(rows)) + chunk(b'IEND', b'')
              path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'vk-curl-photo.png'
              path.write_bytes(image)
              endpoint = vk('photos.getMessagesUploadServer')['upload_url']
              parsed = urllib.parse.urlparse(endpoint)
              hosts = ('vk.com', 'vk.ru', 'vkuserphoto.ru', 'vkuserphoto.com', 'userapi.com')
              if parsed.scheme != 'https' or parsed.username or not any(parsed.hostname == h or (parsed.hostname or '').endswith('.' + h) for h in hosts): stop('untrusted upload endpoint')
              uploaded = request(endpoint, photo=path)
              if not uploaded.get('photo') or uploaded['photo'] == '[]': stop('curl upload returned no accepted photo')
              saved = vk('photos.saveMessagesPhoto', photo=uploaded['photo'], server=uploaded.get('server', 0), hash=uploaded.get('hash', ''))
              if len(saved) != 1 or saved[0].get('id', 0) <= 0 or not saved[0].get('owner_id'): stop('photo save returned no ID')
              photo = saved[0]
              attachment = 'photo' + str(photo['owner_id']) + '_' + str(photo['id'])
              if photo.get('access_key'): attachment += '_' + photo['access_key']
              marker = 'autoposter-ci-curl-' + os.environ['GITHUB_RUN_ID']
              guid = hashlib.sha256((marker + ':' + os.environ.get('GITHUB_RUN_ATTEMPT', '1')).encode()).hexdigest()[:32]
              posted = vk('wall.post', owner_id=-group, from_group=1, attachments=attachment, message=marker, guid=guid)
              if posted.get('post_id', 0) <= 0: stop('wall.post returned no ID')
              print('::notice title=Curl VK photo smoke::Created https://vk.ru/wall-' + str(group) + '_' + str(posted['post_id']) + '; post left for manual inspection')
          except SystemExit:
              raise
          except Exception as e:
              stop('control failed: ' + type(e).__name__)
          PY_CURL
      - name: Create text and photo posts in Telegram and VK
        shell: bash
        run: |
          go test -race -tags=live -run '^TestLiveTelegram(ToVK|PhotoToVK)$' -count=1 -timeout=7m -v ./internal/poster 2>&1 | tee "$RUNNER_TEMP/live-test.log"
        env:
          RUN_LIVE_INTEGRATION: 'true'
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/poster_live_test
          TG_TEST_BOT_TOKEN: ${{ secrets.TG_TEST_BOT_TOKEN }}
          VK_TEST_USER_TOKEN: ${{ secrets.VK_TEST_USER_TOKEN || secrets.VK_TEST_COMMUNITY_TOKEN }}
          TG_TEST_CHANNEL_ID: ${{ vars.TG_TEST_CHANNEL_ID }}
          TG_TEST_OWNER_ID: ${{ secrets.TG_TEST_OWNER_ID }}
          VK_TEST_GROUP_ID: ${{ vars.VK_TEST_GROUP_ID }}
      - name: Annotate live test failure
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY_ANNOTATE'
          import os, pathlib, re
          for filename in ('live-test.log',):
              log = pathlib.Path(os.environ['RUNNER_TEMP']) / filename
              if not log.exists():
                  continue
              for line in log.read_text(errors='replace').splitlines():
                  match = re.match(r'\s*([A-Za-z0-9_]+_test\.go):(\d+):\s*(.*)', line)
                  if match:
                      message = match[3].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error file=internal/poster/{match[1]},line={match[2]},title=Live integration failure::{message}')
          PY_ANNOTATE
